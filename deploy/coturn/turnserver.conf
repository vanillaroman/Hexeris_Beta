# Hexeris coturn — the TURN/STUN relay for WebRTC calls.
# Replace three placeholders before starting: __DOMAIN__, __EXTERNAL_IP__ and
# __SECRET__. __SECRET__ must match the application's TURN_SECRET in .env.

listening-port=3478
tls-listening-port=5349

# Relay port range. Open UDP 49152-65535 in the host firewall.
min-port=49152
max-port=65535

realm=__DOMAIN__

# Ephemeral credentials derived from a shared secret; the application issues
# them from /turn-credentials.
use-auth-secret
static-auth-secret=__SECRET__

# The host's public IP, required behind NAT or a cloud network.
external-ip=__EXTERNAL_IP__

# TLS (turns:5349) reuses the same certificates as the web endpoint.
cert=/etc/letsencrypt/live/__DOMAIN__/fullchain.pem
pkey=/etc/letsencrypt/live/__DOMAIN__/privkey.pem

# Never relay into loopback, private or multicast networks.
no-loopback-peers
no-multicast-peers
fingerprint
no-cli
