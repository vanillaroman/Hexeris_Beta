# Base nginx.conf for Hexeris. The stock image config targets static file
# serving rather than tens of thousands of long-lived WebSockets.
#
# The setting that matters most here is worker_connections. Measured with one
# worker at 128 connections and 150 clients, exactly 61 sockets came up and
# the error log read "128 worker_connections are not enough". Each WebSocket
# user occupies two slots — client to proxy and proxy to app — so the stock
# 1024 caps a worker at roughly 512 online users, and it fails silently by
# dropping clients.

user  nginx;
# One worker per core. On a 1–2 vCPU host that is 1–2 workers, which with
# the default slot count would cap out at ~512–1024 users.
worker_processes  auto;
# File-descriptor ceiling per worker. Without it the worker_connections
# below hits the system ulimit and the extra slots are unreachable.
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    # 16384 slots ≈ 8000 concurrent WebSocket users per worker.
    worker_connections  16384;
    # Accept all ready connections in one pass rather than one at a time,
    # which shows during reconnect storms after a restart.
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # A buffered log: without buffer= every request costs its own write(),
    # an extra syscall per request on the hot path.
    access_log  /var/log/nginx/access.log  main buffer=64k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    # Do not coalesce small packets: chat messages are small frames, and
    # Nagle's delay translates directly into latency here.
    tcp_nodelay     on;

    keepalive_timeout  65;
    # The default of 100 drops keepalive after a hundred requests, forcing
    # a fresh TCP and TLS handshake — pure waste for a single-page app that
    # stays open for hours.
    keepalive_requests 1000;

    types_hash_max_size 2048;
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/javascript application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
