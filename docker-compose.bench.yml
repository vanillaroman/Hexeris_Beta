# Benchmark overlay: pins resources so before/after runs are comparable and
# the profile resembles a minimal server (2 vCPU / 2 GB for the whole stack).
#   docker compose -f docker-compose.yml -f docker-compose.bench.yml up -d --build
services:
  db:
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
    ports:
      - "55440:5432"          # direct access for psql and seeding
    # An overlay's command replaces the base one entirely, so the production
    # settings are repeated here; otherwise measurements would run against a
    # stock Postgres. Added on top: pg_stat_statements (to see which queries
    # spend the CPU instead of guessing from msg/s) and checkpoint/autovacuum
    # logging, which catches background spikes that otherwise look like
    # unexplained noise.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - wal_buffers=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - commit_delay=200
      - -c
      - commit_siblings=5
      - -c
      - synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-on}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_checkpoints=on
      - -c
      - log_autovacuum_min_duration=0
      - -c
      - log_min_duration_statement=-1

  app:
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    ports:
      - "18080:8080"          # bypasses the proxy, to measure its own cost

  nginx:
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
