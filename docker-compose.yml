# Hexeris — development stack. One command:
#   docker compose up -d      →  http://localhost
# No TLS, no domain, no certificates. The secrets below are fixed development
# values and are NOT safe for anything else; production uses
# docker-compose.prod.yml.
name: hexeris

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hexeris
      POSTGRES_USER: hexeris
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexeris -d hexeris"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Mirrors the production settings (docker-compose.prod.yml), so local
    # measurements reflect the real thing rather than a stock Postgres.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - wal_buffers=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - commit_delay=200
      - -c
      - commit_siblings=5
      - -c
      - synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-on}

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hexeris:devpassword@db:5432/hexeris?sslmode=disable
      # Development secrets: fixed and unsafe, for localhost only.
      JWT_SECRET: dev-insecure-jwt-secret-change-in-prod
      SERVER_ENC_KEY: /REmv6TijnY09kMt7irkqQ/RnR2hVU0xyyikCRtWqzg=
      APP_NAME: "Hexeris (dev)"
      ADMIN_KEY: devadmin
      # APP_DOMAIN is left unset, so the server defaults to localhost.
      # TURN, VAPID and Google are unnecessary here: calls on localhost
      # connect peer-to-peer without a relay.
    volumes:
      - appdata:/data
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    # If port 80 is taken by a system web server, stop it or pick another
    # port:  HTTP_PORT=8080 docker compose up -d
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # The base config is ours as well: the stock worker_connections=1024
      # is too low, because one WebSocket user occupies two slots (client to
      # proxy and proxy to app).
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  appdata:
