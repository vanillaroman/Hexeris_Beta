# ─────────────────────────────────────────────────────────────────────────────
# Hexeris — reverse-proxy configuration for the operations host.
#
# Replace the placeholders before use:
#   __PANEL_DOMAIN__      the domain that serves this panel (e.g. ops.example.com)
#   __MESSENGER_DOMAIN__  the domain where the messenger runs (e.g. chat.example.com)
#   __PANEL_ROOT__        the directory holding the static files (e.g. /var/www/hexeris-ops)
#   __OPERATOR_IP__       the address (or range) allowed to open the panel
#
# Why this file exists. The panel (admin-index.html) calls the relative path
# `/admin-api/...`: it never learns the messenger's address and never holds
# ADMIN_KEY. Without an `/admin-api/` location every request answers 404 from
# the static root, which the panel shows as "Cannot reach the API" — the
# endpoint is alive, there is simply no route to it.
#
# The shape:
#   operator's browser ──TLS──> __PANEL_DOMAIN__ (this proxy)
#                                 ├── /            static: the status page
#                                 ├── /admin/      static: the panel
#                                 ├── /admin-api/  ──TLS──> messenger /admin/*  (+ X-Admin-Key)
#                                 └── /api/health  ──TLS──> messenger /healthz
#
# The key lives only here, in a root-owned include. It never reaches the
# browser in any form, which is the whole reason the panel goes through a
# proxy rather than calling the messenger directly.
#
# Installation:
#   sudo cp nginx-admin-panel.conf /etc/nginx/sites-available/hexeris-ops
#   sudo ln -s /etc/nginx/sites-available/hexeris-ops /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# ── One-time setup before the first reload ───────────────────────────────────
#
# 1. Static files:
#      sudo mkdir -p __PANEL_ROOT__/admin
#      sudo cp status-index.html __PANEL_ROOT__/index.html
#      sudo cp admin-index.html  __PANEL_ROOT__/admin/index.html
#
# 2. Basic auth on top of the IP filter (a second barrier, independent of
#    ADMIN_KEY):
#      sudo apt install -y apache2-utils
#      sudo htpasswd -c /etc/nginx/.htpasswd-admin operator
#      sudo chown root:www-data /etc/nginx/.htpasswd-admin && sudo chmod 640 /etc/nginx/.htpasswd-admin
#
# 3. A certificate for __PANEL_DOMAIN__ (certbot or your own PKI).
#
# 4. On the messenger host, in the service environment:
#      ADMIN_ALLOWED_IPS=<public IP of this proxy>
#      ADMIN_KEY=<the same key as in the include below>
#    Check that ADMIN_ALLOWED_IPS matches this proxy's address rather than the
#    operator's browser: X-Forwarded-For is deliberately not forwarded below.

# A resolver is required when the messenger lives behind a name whose address
# can change. Without a variable in proxy_pass, nginx resolves the host once at
# startup and keeps the stale address until it is restarted, after which the
# panel quietly reaches the wrong machine or times out.
resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
resolver_timeout 5s;

# HTTP → HTTPS. The panel sends an access key in a header, so a plain channel
# is unacceptable even for a redirect.
server {
    listen 80;
    listen [::]:80;
    server_name __PANEL_DOMAIN__;
    return 301 https://__PANEL_DOMAIN__$request_uri;
}

server {
    # The `listen ... http2` form is understood by nginx from 1.9.5 through
    # 1.29 (deprecated with a warning since 1.25.1, but working). The separate
    # `http2 on;` directive only appeared in 1.25.1 and breaks the config on
    # distributions shipping 1.18/1.24 with «unknown directive "http2"». On
    # 1.25.1+ replace both lines with `listen 443 ssl;` plus `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __PANEL_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__PANEL_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PANEL_DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root  __PANEL_ROOT__;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "DENY"               always;
    add_header Referrer-Policy        "no-referrer"        always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Responses are small, but a CSV export pulls several pages in a row, so
    # the connection is kept alive.
    keepalive_timeout 65s;

    # ── Public status page ───────────────────────────────────────────────────
    location = / {
        try_files /index.html =404;
    }

    # ── The panel itself (static) ────────────────────────────────────────────
    # Two independent barriers: an IP allowlist and basic auth. Even with both
    # passed, the messenger separately checks ADMIN_KEY and its own
    # ADMIN_ALLOWED_IPS.
    location /admin/ {
        # allow __OPERATOR_IP__;
        # deny  all;            # ← uncomment together with the allow lines

        auth_basic           "Hexeris admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        alias __PANEL_ROOT__/admin/;
        index index.html;

        # The panel is uploaded by hand. Without no-cache an operator's browser
        # will one day show an old build talking to a changed API, and half an
        # hour disappears into working out why.
        #
        # Note: any add_header in a location cancels every server-level
        # add_header rather than adding to them, so the security headers are
        # repeated here in full. Otherwise the panel would be the one place on
        # the site without nosniff and X-Frame-Options.
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"          always;
        add_header X-Frame-Options        "DENY"             always;
        add_header Referrer-Policy        "no-referrer"      always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # The panel is one self-contained file with no external dependencies.
        # Inline <style>/<script> require 'unsafe-inline': the file is built
        # without a bundler, which is a deliberate choice.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    }

    # ── Proxy to the messenger's admin API ───────────────────────────────────
    # A regular expression rather than a prefix: the variable in proxy_pass
    # makes nginx re-resolve DNS but disables automatic URI pass-through, so
    # the remainder of the path is forwarded explicitly through $1.
    location ~ ^/admin-api/(.*)$ {
        # allow __OPERATOR_IP__;
        # deny  all;
        auth_basic           "Hexeris admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        set $backend "__MESSENGER_DOMAIN__";
        proxy_pass https://$backend/admin/$1$is_args$args;

        # The key is injected here and nowhere else — but it lives in its own
        # file rather than in this one: configs get shown, forwarded and
        # committed, and the key would travel with them.
        #
        #   sudo sh -c 'printf "proxy_set_header X-Admin-Key \"%s\";\n" "$(cat /dev/stdin)" > /etc/nginx/admin-key.inc'
        #   sudo chmod 600 /etc/nginx/admin-key.inc
        #
        # ⚠️ There is exactly one such file at exactly this path. A second file
        # with "its own" key elsewhere does not help: proxy_set_header inside a
        # location overrides anything declared higher up, and the key sent is
        # the one from here. Debugging then looks as though the key is correct
        # and the server refuses it anyway.
        include /etc/nginx/admin-key.inc;

        proxy_set_header Host  $backend;
        proxy_ssl_server_name  on;      # SNI: without it the wrong certificate is served
        proxy_ssl_verify       on;      # the hop to the messenger is verified for real
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        # X-Forwarded-For is deliberately not forwarded. The messenger trusts
        # its own local proxy and reads the client address from that header; if
        # a browser-supplied one reached it, anyone could substitute an
        # arbitrary address and bypass ADMIN_ALLOWED_IPS. An empty value makes
        # nginx omit the header entirely, so the messenger sees this proxy's
        # real address — which is what the allowlist is for.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP       "";

        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;

        # Admin data must not settle anywhere along the path. add_header in a
        # location cancels the server-level ones, so the needed ones repeat.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── Health endpoint for the public status page ───────────────────────────
    # Open without authentication on purpose: /healthz without ?v=1 answers
    # only "ok" or "db unreachable" and reveals nothing about internals. The
    # per-component breakdown (?v=1) is not proxied here — $args are dropped.
    location = /api/health {
        set $backend "__MESSENGER_DOMAIN__";
        proxy_pass https://$backend/healthz;

        proxy_set_header Host $backend;
        proxy_ssl_server_name on;
        proxy_ssl_verify      on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 4s;
        proxy_read_timeout    6s;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Nothing else is served: a file dropped into the web root by accident must
    # not become public.
    location / {
        return 404;
    }
}
