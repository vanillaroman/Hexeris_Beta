# Development nginx: localhost over plain HTTP, reverse-proxying the app.
# No TLS, certificates or redirects. Mounted as conf.d/default.conf.
# It mirrors the production structure (an upstream plus a separate /ws
# location) so local measurements carry over.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream hexeris_app {
    server app:8080;
    keepalive 128;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80 backlog=4096;
    server_name localhost;

    client_max_body_size 64m;
    client_body_buffer_size 256k;

    location /ws {
        proxy_pass http://hexeris_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_socket_keepalive on;
    }

    location / {
        proxy_pass http://hexeris_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
